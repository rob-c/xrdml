[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xrdml"
version = "0.1.0"
description = "Training data straight off a URL: ROOT trees to PyTorch and TensorFlow tensors, without a download"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = ["machine-learning", "pytorch", "tensorflow", "root", "xrootd", "streaming"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The ROOT reader underneath, which brings the client underneath that. Neither
# framework is a dependency: PyTorch and TensorFlow are imported when a batch
# is asked for, so a file can be opened, described and read on a machine that
# has neither.
dependencies = ["xrdroot @ git+https://github.com/rob-c/xrdroot@main"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = [
  "complexipy>=6,<7",
  # One test fixture is a zstd-compressed ROOT file, which the reader can only
  # open where the interpreter carries `compression.zstd` (3.14 and later) or
  # this is installed.
  "zstandard>=0.21",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "radon>=6,<7",
  "ruff>=0.5",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

# The layers below are required by repository URL until they are on PyPI,
# and hatchling wants that said out loud.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xrdml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests/test_maintainability.py`` imports ``tools.maintainability``, and a
# bare ``pytest`` - which is what CI runs - does not put the working directory
# on the path the way ``python -m pytest`` does.
pythonpath = ["."]
timeout = 120
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["xrdml"]
parallel = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
# ``tensors.py`` is where the batches are actually made, so a gap there is an
# untested path against somebody's training loop: it is gated at the full
# line-and-branch mark. The friendly surface above it is not, because its
# coverage depends on which framework is installed - the suite covers it too,
# with a stand-in for PyTorch, but only what runs without one is guaranteed.
include = ["*/xrdml/tensors.py"]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# RUF022/RUF023: ``__all__`` and ``__slots__`` are grouped by meaning here
# rather than alphabetised, with a comment on each group.
ignore = ["E741", "RUF022", "RUF023"]

[tool.mypy]
# The floor is 3.9 - what RHEL 9 and AlmaLinux 9 ship - but mypy itself refuses
# to be pointed below 3.10, so the floor is held by the interpreter instead:
# CI runs the suite on a real 3.9.
python_version = "3.10"
strict = true
packages = ["xrdml"]
mypy_path = "src"

# TensorFlow ships no stubs and is reached through a narrow, guarded import,
# so untyped is the honest description of it rather than a hole in our own
# checking. PyTorch is deliberately not listed: the guarded ``import torch``
# carries its own ignore, and silencing the module here would make that ignore
# unused on a machine which has it.
[[tool.mypy.overrides]]
module = ["tensorflow.*"]
ignore_missing_imports = true

# matplotlib drags numpy in, whose stubs use syntax newer than the floor this
# package is checked against; neither is followed into.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
