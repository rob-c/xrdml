site_name: xrdml
site_description: Training data, from a URL to a training loop, without a download
site_url: https://example.org/xrdml/
repo_url: https://github.com/rob-c/xrdml
copyright: LGPL-3.0-or-later

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Machine learning: ml.md
  - Into PyTorch and TensorFlow: tensors.md
  - Training playbooks: playbooks.md
  - Reference:
      - API: api.md
      - Maintainability metrics: maintainability.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

watch:
  - src/xrdml
